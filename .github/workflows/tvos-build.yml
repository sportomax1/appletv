name: tvOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Apple TV Hub
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleTVHub.xcodeproj \
            -target AppleTVHub \
            -sdk appletvsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
